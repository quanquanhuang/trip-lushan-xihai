<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>小红书搜索</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#fafafa;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:24px;text-align:center}
.icon{font-size:48px;margin-bottom:16px}
h2{font-size:20px;color:#333;margin-bottom:6px}
.keyword{font-size:16px;color:#ff2442;font-weight:600;margin-bottom:24px}
a.btn{display:block;width:100%;max-width:300px;padding:14px 0;background:#ff2442;color:#fff;border-radius:24px;text-decoration:none;font-size:16px;margin:8px auto;font-weight:500;transition:opacity .2s}
a.btn:active{opacity:.8}
a.btn.outline{background:#fff;color:#ff2442;border:1.5px #ff2442 solid;font-weight:400}
.tip{font-size:12px;color:#aaa;margin-top:20px;line-height:1.6}
</style>
</head>
<body>
<div class="icon">📕</div>
<h2>搜索小红书攻略</h2>
<div class="keyword" id="kw"></div>
<a class="btn" id="appBtn" href="#">📱 打开小红书 App</a>
<a class="btn outline" id="webBtn" href="#">🌐 用网页版搜索</a>
<div class="tip">提示：App 搜索需要已安装小红书</div>
<script>
(function(){
  var p=new URLSearchParams(location.search);
  var kw=p.get('keyword')||'';
  document.getElementById('kw').textContent='「'+kw+'」';
  document.getElementById('appBtn').href='xhsdiscover://search/result?keyword='+encodeURIComponent(kw)+'&target_search=notes&source=deeplink';
  document.getElementById('webBtn').href='https://www.xiaohongshu.com/search_result?keyword='+encodeURIComponent(kw)+'&source=web_explore_feed';
  document.title=kw+' - 小红书搜索';
})();
</script>
</body>
</html>
